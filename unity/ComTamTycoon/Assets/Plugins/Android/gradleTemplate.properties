# Unity Android gradle properties template.
# **BUILD_SETTINGS** / **ADDITIONAL_PROPERTIES** are substituted by Unity — do
# not remove them.

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# Play requires 16 KB page alignment on recent Android; being explicit avoids a
# late surprise at submission.
android.bundle.enableUncompressedNativeLibs=true

unityStreamingAssets=**STREAMING_ASSETS**

**ADDITIONAL_PROPERTIES**
